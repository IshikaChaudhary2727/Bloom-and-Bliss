<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="cont.css">
</head>
<body>
    <div class="part1">
        <div class="img1">
            <img src="flowercontact.jpeg" width="1450px" height="300px" alt="logo">
        </div>
        <section class="contact-container">
            <div class="get-in-touch">
                <h2>Get in Touch</h2>
                <p>
                    We'd love to hear from you!
                    Whether you have a question, need help
                    choosing flowers or want a customized
                    bouquet, feel free to contact us.
                </p>
                <div class="contact-details">
                    <h3>Email Us</h3>
                    <p>hello@bloomandbliss.com</p>

                    <h3>Call Us</h3>
                    <p>+91 43873 98809</p>

                    <h3>Our Location</h3>
                    <p>Lovely Professional University</p>
                </div>
            </div>
            <div class="contact-form">
                <h2>Send us a Message</h2>
                <form>
                    <label>Full Name</label>
                    <input type="text"
                    placeholder="Enter your name" required>
                    <label>Email Address</label>
                    <input type="email"
                    placeholder="Enter your email" required>
                    <label>Subject</label>
                    <input type="text"
                    placeholder="Wite your message...." required>
                    <label>Your Message</label>
                    <label>Your Message</label>
                    <textarea rows="4"
                    placeholder="Write your message..."
                    required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </div>
</body>
